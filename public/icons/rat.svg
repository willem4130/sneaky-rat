<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with purple glow -->
  <circle cx="64" cy="64" r="60" fill="#0d0d0d"/>
  <circle cx="64" cy="64" r="60" fill="url(#purpleGlow)" opacity="0.3"/>

  <!-- Rat emoji styled -->
  <text x="64" y="90" font-size="72" text-anchor="middle" filter="url(#glow)">🐀</text>

  <defs>
    <radialGradient id="purpleGlow">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
